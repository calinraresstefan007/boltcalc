name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest
          packages: platforms;android-34 build-tools;34.0.0
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      
      # Generate debug keystore for release build
      - name: Generate keystore
        run: |
          keytool -genkeypair -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore release.keystore -storepass android -keypass android \
            -dname "CN=BoltCalc, OU=BoltCalc, O=BoltCalc, L=City, ST=State, C=US"
      
      - name: Build release APK
        run: gradle assembleRelease
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android
      
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BoltCalc-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      
      # Also build debug for testing
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BoltCalc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
