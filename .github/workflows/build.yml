name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platforms;android-34 build-tools;34.0.0
          accept-android-sdk-licenses: true

      - name: Run unit tests
        run: java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain testDebugUnitTest

      - name: Generate keystore
        run: |
          keytool -genkeypair -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore release.keystore -storepass android -keypass android \
            -dname "CN=BoltCalc, OU=BoltCalc, O=BoltCalc, L=City, ST=State, C=US"

      - name: Build release APK
        run: java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleRelease
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: BoltCalc-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: BoltCalc-apk
          path: ./apk

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: Bolt Calc v${{ github.run_number }}
          body: |
            Auto-generated release from GitHub Actions run #${{ github.run_number }}

            **Changes:** ${{ github.event.head_commit.message }}

            **APK:** `app-release.apk`
          files: ./apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
